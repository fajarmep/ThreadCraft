name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          ./gradlew assembleDebug -PversionCode=${VERSION_CODE} -PversionName=1.0.${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk "build-output/ThreadCraft-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreadCraft-v1.0.${{ github.run_number }}
          path: build-output/ThreadCraft-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ThreadCraft v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: build-output/ThreadCraft-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
